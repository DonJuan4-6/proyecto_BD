<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda - Contacto</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Nav Bar -->
    <header class = "navbar">
        <div class="contenedor nav-contenido">
            <a href="index.html" class ="logo">Mi<strong>Tienda</strong></a>
            <nav class = "nav-links">
                <a href="index.html">Inicio</a>
                <a href="index.html#productos">Productos</a>
                <a href="contacto.html">Contacto</a>
            </nav>
        </div>
    </header>


    <main class="contenedor">
        <div class="encabezado-principal">
            <h1>Formulario de contacto</h1>
            <p>Envianos tu mensaje y consulta los contactos registrados.</p>
        </div>

        <div class="panel-contacto">
            <section class="tarjeta">
                <h2 id="tituloFormularioContacto">Contacto</h2>

                <form id="formularioContacto">
                    <input type="hidden" id="contactoId" value=""/>

                    <div class="campo">
                        <label for="contactoNombre">Nombre:</label>
                        <input 
                            type="text" 
                            id="contactoNombre" 
                            placeholder="Ej: Juan Pérez" 
                            maxlength="100"
                            required
                        />
                    </div>

                    <div class="campo">
                        <label for="correo">Correo:</label>
                        <input type="email" id="correo" maxlength="254" placeholder="Ej: juan@correo.com" required/>
                    </div>

                    <div class="campo">
                        <label for="asunto">Asunto:</label>
                        <input 
                            type="text" 
                            id="asunto"
                            placeholder="Motivo de tu consulta"
                            maxlength="200"
                            required
                        />
                    </div>
                    
                    <div class="campo">
                        <label for="mensaje">Mensaje:</label>
                        <textarea id="mensaje" rows="5" maxlength="5000" required></textarea>
                    </div>
                    
                    <div class="acciones-form">
                        <button type="submit" id="btnGuardarContacto" class="btn btn-guardar">Guardar Contacto</button>
                        <button type="button" id="btnCancelarContacto" class="btn btn-cancelar">Cancelar</button>
                    </div>
                </form>
            </section>

            <section class="tarjeta" id="contactos">
                <h2>Lista de contactos</h2>
                <p id="estadoContactos" class="estado-contactos" role="status" aria-live="polite"></p>
                <div id="listaContactos" class="lista-contactos"></div>
            </section>
        </div>

    </main>
    <footer class="footer">
        <div class="contenedor footer-contenido">
            <p>&copy; 2024 Mi Tienda. Todos los derechos reservados.</p>
        </div>
    </footer>
        <script src="app.js"></script>
</body>
</html>
