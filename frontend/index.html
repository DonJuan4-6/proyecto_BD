<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda - Gestión de Productos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Nav Bar -->
    <header class = "navbar">
        <div class="contenedor nav-contenido">
            <a href="index.html" class ="Logo">Mi<strong>Tienda</strong></a>
            <nav class = "nav-links">
                <a href="index.html">Inicio</a>
                <a href="#productos">Productos</a>
                <a href="contacto.html">Contacto</a>
            </nav>
        </div>
    </header>


    <main class="contenedor">
        <div class="encabezado-principal">
            <h1>Sistema de Gestión de Productos</h1>
            <p>Panel conectado a Node.js, Express y MySQL</p>
        </div>

        <div class="panel-tienda">
            <section class="tarjeta">
                <h2 id="tituloFormulario">Registrar producto</h2>

                <!--FORMULARIO AGREGAR PRODUCTO-->
                <form id= "formularioProducto" action="">
                    <input type="hidden" id="productoId" value=""/>

                    <div class="campo">
                        <label for="nombre">Nombre del producto:</label>
                        <input 
                            type="text" 
                            id="nombre" 
                            placeholder="Ej: Camiseta" 
                            required
                        />
                    </div>

                    <div class="campo">
                        <label for="precio">precio:</label>
                        <input type="number" id="precio" step="0.1" placeholder="Ej: 250000" required/>
                    </div>
                    
                    <div class="campo">
                        <label for="stock">Stock (cantidad)</label>
                        <input type="number" id="stock" step="1" placeholder="Ej: 10" required/>
                    </div>

                    <div class ="acciones-form">
                        <button type="submit" id="btnGuardar" class="btn btn-guardar">Guardar Producto</button>
                        <button type="button" id="btnCancelar" class="btn btn-cancelar">Cancelar</button>
                    </div>
                </form>

            </section>


            <!-- SECCION DE LISTA DE PRODUCTOS-->
            <section class="tarjeta" id="productos">
                    <h2>Lista de Productos</h2>
                    <div id="listaProductos" class="lista-productos">
                        <!--LOS PRODUCTOS SE CARGAN DESDE APP.JS-->
                    </div>
                </section>

        </div>
          
        </main>
        <!-- ==== FOOTER ==== -->
                 <footer class="footer">
                    <div class="contenedor footer-contenido">
                        <p>&copy; 2024 Mi Tienda. Todos los derechos reservados.</p>
        <script src="app.js"></script>
</body>
</html>
